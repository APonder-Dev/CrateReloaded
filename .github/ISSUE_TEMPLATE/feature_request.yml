name: Feature request
description: A specific, ready-to-build improvement for CrateReloaded.
title: "[Feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Early ideas and open-ended discussion fit best in [Ideas](https://github.com/APonder-Dev/CrateReloaded/discussions/categories/ideas), where others can upvote them. Use this form for a concrete feature you can describe in detail.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you request
      options:
        - label: I searched [existing issues](https://github.com/APonder-Dev/CrateReloaded/issues?q=is%3Aissue) and [Ideas](https://github.com/APonder-Dev/CrateReloaded/discussions/categories/ideas) and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
      placeholder: "I want seasonal crates that only open during an event, but there's no way to limit opening by date."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Config examples, commands or mockups help a lot.
      placeholder: |
        A new crate option:
        ```yaml
        open-between: "2026-12-01 to 2026-12-31"
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Opening crates / animations
        - Rewards
        - Keys and giving crates
        - Claims
        - Menus
        - Holograms
        - Commands and permissions
        - Config, messages or translations
        - Integrations
        - Developer API
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Can you help?
      options:
        - I can submit a pull request
        - I can help test it
        - Not this time
    validations:
      required: true
