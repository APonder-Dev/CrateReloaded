name: Bug report
description: Something in CrateReloaded is broken or behaves wrongly.
title: "[Bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A clear report with steps to reproduce gets fixed fastest.

        **Not a bug?** Setup and config questions go to [Q&A](https://github.com/APonder-Dev/CrateReloaded/discussions/categories/q-a), feature ideas to [Ideas](https://github.com/APonder-Dev/CrateReloaded/discussions/categories/ideas).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you report
      options:
        - label: I searched [existing issues](https://github.com/APonder-Dev/CrateReloaded/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I am running the [latest release](https://github.com/APonder-Dev/CrateReloaded/releases/latest) and the jar that matches my server (`mc26`, `mc121` or `mc120`).
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug, and what you expected to happen instead.
      placeholder: |
        When a player opens FoodKey (CSGO animation) and the animation ends, no reward is given.
        Expected: the player receives the reward the animation landed on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps from a fresh start. Include the commands you ran.
      placeholder: |
        1. /cr set FoodKey on a chest
        2. /cr give to Steve FoodKey 1
        3. Steve right-clicks the chest with the key
        4. The animation finishes, but no reward is given
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin is affected? Pick all that apply.
      multiple: true
      options:
        - Opening crates / animations
        - Rewards
        - Keys and giving crates
        - Claims (/cr claim)
        - Preview and other menus
        - Holograms
        - Commands and permissions
        - Config, messages or translations
        - Integrations (Vault, PlaceholderAPI, Citizens, ...)
        - Performance / lag
        - Startup or reload
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: CrateReloaded version and jar
      description: The jar file name, or the output of `/cr version`.
      placeholder: "CrateReloaded-2.4.0-mc26.jar"
    validations:
      required: true

  - type: dropdown
    id: server-software
    attributes:
      label: Server software
      options:
        - Paper
        - Purpur
        - Pufferfish
        - Folia
        - Spigot
        - Other (say which below)
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The output of `/version`.
      placeholder: "Paper 26.1.2-55"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Shown near the top of the server log at startup.
      placeholder: "25"

  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - I don't know
        - "No, it never worked"
        - "Yes, it worked in an earlier version (say which below)"

  - type: textarea
    id: config
    attributes:
      label: Crate and config
      description: The crate config involved (from `plugins/CrateReloaded/crates/`) and any related `config.yml` settings. Remove anything private.
      render: yaml
      placeholder: |
        FoodKey:
          type: KEY
          animation: CSGO
          end-animation: BLANK

  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: |
        Any errors or warnings from `logs/latest.log`, from startup to the moment of the bug. Paste the full stack trace.
        For a long log, upload it to [mclo.gs](https://mclo.gs) and paste the link.
      render: shell

  - type: textarea
    id: plugins
    attributes:
      label: Other plugins
      description: The output of `/plugins`, or at least hologram, economy, protection and inventory plugins.
      placeholder: "DecentHolograms 2.9.2, Vault 1.7.3, EssentialsX 2.21.0, WorldGuard 7.0.13"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, videos, or what you already tried. Drag files in to attach them.
